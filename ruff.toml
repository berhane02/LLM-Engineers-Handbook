line-length = 120
target-version = "py311"
extend-exclude = [
    ".github",
    "graphql_client",
    "graphql_schemas",
    "llm_engineering/model/finetuning/finetune.py",  # Has intentional print statements for SageMaker debugging
    "tools/"  # Exclude tool scripts from linting
]

[lint]
extend-select = [
  "I",
  "B",
  "G",
  "T20",
  "PTH",
  "RUF"
]

[lint.isort]
case-sensitive = true

[lint.pydocstyle]
convention = "google"